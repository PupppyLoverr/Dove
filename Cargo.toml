[workspace]
resolver = "3"
# apps/dove is the GPUI app this branch replaces: kept out of the build, read
# only as the reference while its UI-free modules move into crates/dove-app.
members = ["crates/*", "apps/keplorayx"]
exclude = ["mesh", "vendor/zgx", "apps/dove", "apps/ios", "apps/android", "apps/landing", "apps/extension"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PupppyLoverr/Dove"
# zgx's own minimum.
rust-version = "1.95"

[workspace.dependencies]
dove-proto = { path = "crates/dove-proto" }
dove-store = { path = "crates/dove-store" }
dove-harness = { path = "crates/dove-harness" }
dove-git = { path = "crates/dove-git" }
dove-core = { path = "crates/dove-core" }
dove-term = { path = "crates/dove-term" }

anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
# 0.32 matches Zeron's rusqlite, so both graphs link one sqlite.
rusqlite = { version = "0.32.1", features = ["bundled"] }
which = "8"
parking_lot = "0.12"
tempfile = "3"
mimalloc = { version = "0.1", default-features = false }
# zgx, pinned to the revision the Windows port (zeron `windows/zgx-parity`)
# builds against. Move every pin below together.
zgx = { git = "https://github.com/zeronsh/zgx", rev = "f01b47a00a6f5e9386b5fd7fb35dcdbef4991e93" }
zgx-desktop = { git = "https://github.com/zeronsh/zgx", rev = "f01b47a00a6f5e9386b5fd7fb35dcdbef4991e93" }
zgx-script = { git = "https://github.com/zeronsh/zgx", rev = "f01b47a00a6f5e9386b5fd7fb35dcdbef4991e93" }
zgx-run = { git = "https://github.com/zeronsh/zgx", rev = "f01b47a00a6f5e9386b5fd7fb35dcdbef4991e93", default-features = false }

[profile.dev]
opt-level = 1
# zgx is slow unoptimized: optimize dependencies, keep the app quick to build.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# zgx's own patches (its root Cargo.toml): a git dependency does not bring
# them, so every consumer repeats them. With GPUI gone from this workspace
# they reach nothing else.
[patch.crates-io]
wgpu-hal = { path = "vendor/zgx/vendor/wgpu-hal" }
winit = { path = "vendor/zgx/vendor/winit" }
accesskit_macos = { path = "vendor/zgx/vendor/accesskit_macos" }
accesskit_consumer = { path = "vendor/zgx/vendor/accesskit_consumer" }
accesskit_atspi_common = { path = "vendor/zgx/vendor/accesskit_atspi_common" }
accesskit_unix = { path = "vendor/zgx/vendor/accesskit_unix" }
accesskit_windows = { path = "vendor/zgx/vendor/accesskit_windows" }

# zgx itself, vendored at the pinned revision (vendor/zgx) with one fix:
# an input method asking where a removed field is no longer aborts the app
# (vendor/zgx/crates/zgx/src/widgets.rs, marked "Keplorayx").
[patch."https://github.com/zeronsh/zgx"]
zgx = { path = "vendor/zgx/crates/zgx" }
zgx-desktop = { path = "vendor/zgx/crates/zgx-desktop" }
zgx-script = { path = "vendor/zgx/crates/zgx-script" }
zgx-run = { path = "vendor/zgx/crates/zgx-run" }
zgx-components = { path = "vendor/zgx/crates/zgx-components" }
zgx-gpu = { path = "vendor/zgx/crates/zgx-gpu" }
zgx-terminal = { path = "vendor/zgx/crates/zgx-terminal" }
zgx-ghostty-sys = { path = "vendor/zgx/crates/zgx-ghostty-sys" }
zgx-alacritty-terminal = { path = "vendor/zgx/vendor/alacritty-terminal" }
zgx-cosmic-text = { path = "vendor/zgx/vendor/cosmic-text" }
zgx-harfrust = { path = "vendor/zgx/vendor/harfrust" }
zgx-mlua = { path = "vendor/zgx/vendor/mlua" }
zgx-taffy = { path = "vendor/zgx/vendor/taffy" }
zgx-zune-jpeg = { path = "vendor/zgx/vendor/zune-jpeg" }
wgpu-hal = { path = "vendor/zgx/vendor/wgpu-hal" }
winit = { path = "vendor/zgx/vendor/winit" }
accesskit_macos = { path = "vendor/zgx/vendor/accesskit_macos" }
accesskit_consumer = { path = "vendor/zgx/vendor/accesskit_consumer" }
accesskit_atspi_common = { path = "vendor/zgx/vendor/accesskit_atspi_common" }
accesskit_unix = { path = "vendor/zgx/vendor/accesskit_unix" }
accesskit_windows = { path = "vendor/zgx/vendor/accesskit_windows" }
