<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dove</title><link rel="stylesheet" href="panel.css"></head>
<body>
  <header>
    <img src="icons/32.png" alt="" width="18" height="18">
    <span class="title">Dove</span>
    <span id="status" class="status"><span class="dot"></span><span id="status-text">…</span></span>
  </header>

  <section id="pair" hidden>
    <p class="muted">Open Dove → Settings → Integrations → Chrome and paste the pairing code here. It stays in this browser only.</p>
    <div class="row"><input id="code" placeholder="dove-…" spellcheck="false" autocomplete="off"><button id="pair-btn" class="primary">Pair</button></div>
    <p id="pair-err" class="err"></p>
  </section>

  <section id="site" class="card">
    <div class="row between">
      <div><div class="label">This site</div><div id="origin" class="muted mono">—</div></div>
      <label class="switch"><input type="checkbox" id="allow"><span></span></label>
    </div>
    <div id="control" class="control" hidden><span class="dot"></span>Dove is controlling this tab<button id="stop">Stop</button></div>
    <div id="paused" class="control" hidden>Paused by you<button id="resume">Resume</button></div>
  </section>

  <section>
    <div class="row between"><div class="label">Activity</div><button id="clear" class="ghost">Clear</button></div>
    <ol id="log"></ol>
    <p id="empty" class="muted">No actions yet. Ask an agent in Dove to use your browser.</p>
  </section>

  <footer class="row between">
    <button id="reconnect" class="ghost">Reconnect</button>
    <button id="unpair" class="ghost">Unpair</button>
  </footer>
  <script src="panel.js" type="module"></script>
</body>
</html>
