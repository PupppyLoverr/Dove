[package]
name = "dove-grounder"
version = "0.1.0"
edition = "2021"
# A Rust port of nexi-cua's policy (Apache-2.0, PupppyLoverr/NEXI-Models-Drivers).
# assets/nexi-cua-1.onnx is NEXI-CUA-1 exported with scripts/export_onnx.py.
license = "Apache-2.0"
description = "Local Grounder: NEXI-CUA-1 plus its deterministic resolver, turning a goal phrase into an element and a verb with no LLM tokens"
publish = false

[features]
default = ["embedded-model"]
# Build NEXI-CUA-1 (6.4 MB) into the binary, so `act` ranks with no download.
embedded-model = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
regex = "1"
blake2 = "0.10"
unicase = "2"
tract-onnx = { version = "0.23.9", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Golden inputs carry Python floats; parse them bit-exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
