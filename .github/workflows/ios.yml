name: iPhone

# Keplorayx.ipa is unsigned so Sideloadly can re-sign it with an Apple ID.
# The Swift module is still named Zeron. The app on the home screen is Keplorayx.
# It needs iOS 26.

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh
          shared-key: ios-sim
      - name: Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project Zeron.xcodeproj \
            -scheme Zeron \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
      - name: Pack
        run: |
          APP="$GITHUB_WORKSPACE/build/ios/Build/Products/Debug-iphonesimulator/Keplorayx.app"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/Keplorayx-iOS-Simulator.zip"
      - name: Screenshots
        continue-on-error: true
        run: |
          APP="$GITHUB_WORKSPACE/build/ios/Build/Products/Debug-iphonesimulator/Keplorayx.app"
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print([r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and "iOS" in r["name"]][-1])')"
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; t=[d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if "iPhone" in d["name"] and "Pro" in d["name"] and "Max" not in d["name"]]; print(t[-1])')"
          DEV="$(xcrun simctl create shots "$TYPE" "$RUNTIME")"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl install "$DEV" "$APP"
          BUNDLE=sh.dove.ios
          shot() {
            name="$1"; wait="$2"; shift 2
            xcrun simctl terminate "$DEV" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$DEV" "$BUNDLE" "$@"
            sleep "$wait"
            xcrun simctl io "$DEV" screenshot "$OUT/$name.png"
          }
          shot onboarding-warp 2 -signedout
          shot onboarding 8 -signedout
          shot sessions 8 -demo
          shot settings 8 -demo -route more
          shot new-session 8 -demo -route new
          shot chat 10 -demo -route chat:demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Keplorayx-iOS-Screenshots
          path: shots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Keplorayx-iOS-Simulator
          path: Keplorayx-iOS-Simulator.zip
          if-no-files-found: error

  ipa:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh
          shared-key: ios-device
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project Zeron.xcodeproj \
            -scheme Zeron \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ipa" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
      - name: Pack IPA
        run: |
          APP="$GITHUB_WORKSPACE/build/ipa/Build/Products/Debug-iphoneos/Keplorayx.app"
          test -d "$APP"
          STAGE="$GITHUB_WORKSPACE/build/ipa-stage"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/Keplorayx.app"
          (cd "$STAGE" && zip -r -y "$GITHUB_WORKSPACE/Keplorayx.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Keplorayx-ipa
          path: Keplorayx.ipa
          if-no-files-found: error
