name: zgx build

# Builds the app this branch actually ships, on both platforms it targets:
#
#   engine  `zr/`         -> keplorayx-engine
#   app     `zr/apps/zgx` -> keplorayx
#
# `ci.yml` builds the root workspace (`crates/dove-*` + `apps/keplorayx`, the
# Wave 1 reference) and `package.yml` builds the Dove installer pipeline; none
# of them compile `zr/`. This is the job that would have caught the 29 m 33 s
# cold engine compile on a laptop (KEPL-9), and the one that says whether the
# macOS paths in `zr/apps/zgx` have ever compiled.
#
# The two workspaces get their own target dir: they configure different
# profiles (`zr/apps/zgx` optimises every dependency at opt-level 3, `zr/` does
# not), so one shared dir makes each build invalidate the other's artifacts.

on:
  workflow_dispatch:
  push:
    # Every branch, so a zgx/* branch gets a real answer without a PR.
    branches: ["**"]
  pull_request:

concurrency:
  group: zgx-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Absolute target dirs, because `<repo>/.cargo/config.toml` otherwise
          # wins and sends both builds to `C:/dvw/target-kx-zgx`, a
          # developer's Windows path.
          workspaces: |
            zr -> ../../build/zr
            zr/apps/zgx -> ../../build/app
          cache-on-failure: true

      - name: Install Zig (macOS)
        if: runner.os == 'macOS'
        run: |
          # zgx-desktop's `ghostty` feature builds Ghostty from source, and
          # Ghostty's build is Zig 0.16 (zr/apps/zgx/README.md). Without it the
          # build stops and says so.
          brew install zig@0.16 || brew install zig
          ZIG_BIN="$(brew --prefix zig@0.16 2>/dev/null || brew --prefix zig)/bin"
          echo "$ZIG_BIN" >> "$GITHUB_PATH"
          echo "ZIG=$ZIG_BIN/zig" >> "$GITHUB_ENV"
          "$ZIG_BIN/zig" version

      - name: Build the engine
        working-directory: zr
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/zr
        run: cargo build --release --locked -p zeron --bin keplorayx-engine

      - name: Build the app
        working-directory: zr/apps/zgx
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/app
        run: cargo build --release --locked

      - name: Put the engine beside the app
        run: |
          # The app starts `keplorayx-engine` from its own directory
          # (src/engine/manager.rs), which is also how the bundle is laid out.
          cp build/zr/release/keplorayx-engine* build/app/release/
          ls -la build/app/release/keplorayx build/app/release/keplorayx-engine*

      - name: Prove both binaries start
        run: |
          # Compiling is not running: a binary that links but aborts on start
          # still ships. `--version` starts, prints, and exits with no window.
          ./build/zr/release/keplorayx-engine --version
          timeout 60 ./build/app/release/keplorayx --version

      - uses: actions/upload-artifact@v4
        with:
          name: keplorayx-${{ matrix.os }}
          path: |
            build/app/release/keplorayx
            build/app/release/keplorayx.exe
            build/zr/release/keplorayx-engine
            build/zr/release/keplorayx-engine.exe
          if-no-files-found: error

  package-macos:
    # A dry run of the release script, so a packaging problem is a red check
    # instead of a surprise at release time: the bundle is produced and
    # uploaded, nothing is published. The cache from `build` makes the two
    # cargo builds inside the script incremental.
    name: package (macos-latest, dry run)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zr -> ../../build/zr
            zr/apps/zgx -> ../../build/app
          cache-on-failure: true

      - name: Install Zig (macOS)
        run: |
          brew install zig@0.16 || brew install zig
          ZIG_BIN="$(brew --prefix zig@0.16 2>/dev/null || brew --prefix zig)/bin"
          echo "$ZIG_BIN" >> "$GITHUB_PATH"
          echo "ZIG=$ZIG_BIN/zig" >> "$GITHUB_ENV"

      - name: Package (bundle only, no dmg)
        env:
          DMG: "0"
          CARGO_FLAGS: --locked
        working-directory: zr
        run: ./scripts/package-macos.sh

      - name: The bundle is what the app needs
        working-directory: zr
        run: |
          # A bundle that is missing the engine or the scripts starts into
          # nothing on a machine that has never run this app.
          APP="target/package/Keplorayx.app"
          test -x "$APP/Contents/MacOS/keplorayx"
          test -x "$APP/Contents/MacOS/keplorayx-engine"
          test -f "$APP/Contents/Resources/ui/app.luau"
          test -f "$APP/Contents/Resources/plugins-builtin/.keep" 2>/dev/null || test -d "$APP/Contents/Resources/plugins-builtin"
          "$APP/Contents/MacOS/keplorayx-engine" --version
          codesign --verify --strict "$APP"
          du -sh "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: keplorayx-macos-app
          path: zr/target/package/Keplorayx-*.tar.gz
          if-no-files-found: error

  package-windows:
    # The same dry run for the Windows installer: the zip and the Inno Setup
    # installer are produced and uploaded, nothing is published.
    name: package (windows-latest, dry run)
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zr -> ../../build/zr
            zr/apps/zgx -> ../../build/app
          cache-on-failure: true

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package
        run: ./scripts/package-windows.ps1 -ReleasesUrl https://example.invalid/releases

      - name: The package is what the app needs
        run: |
          # Missing the engine or the scripts means an install that starts into
          # nothing on a machine that has never run this app.
          $stage = Get-ChildItem -Directory "$PWD/target/package/zeron-*-windows-*" | Select-Object -First 1
          if (-not $stage) { throw 'No staged package directory' }
          foreach ($f in 'keplorayx.exe', 'keplorayx-engine.exe', 'ui/app.luau') {
            if (-not (Test-Path -LiteralPath (Join-Path $stage.FullName $f))) { throw "missing $f in $($stage.Name)" }
          }
          & (Join-Path $stage.FullName 'keplorayx-engine.exe') --version
          if (Get-ChildItem "$PWD/target/package/zeron-*-windows-*-setup.exe" | Measure-Object | Select-Object -ExpandProperty Count -eq 0) {
            throw 'No installer produced'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: keplorayx-windows-package
          path: |
            zr/target/package/zeron-*-windows-*.zip
            zr/target/package/zeron-*-windows-*-setup.exe
          if-no-files-found: error
