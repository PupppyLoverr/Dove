name: CI

# The root workspace's crates: `crates/dove-*`, kept as the reference teardown
# while `zr/` carries the shipping app. This job used to build and size-gate
# `-p dove`, a package that does not exist here (apps/dove is excluded from the
# workspace), so a green tick said nothing about anything shippable.
#
# The app that ships — `zr/apps/zgx` and `keplorayx-engine` — is built by
# zgx-build.yml, on macOS and Windows.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install GPUI system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig-dev \
            libssl-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libjson-glib-dev \
            pkg-config

      - name: Configure git identity for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # (The app members are compiled by zgx-build.yml instead: they need
        # Zig on macOS and WebKitGTK on Linux, and are not this job's subject.)
        run: cargo test --workspace --exclude keplorayx
