name: cua-driver pin

# Weekly: when trycua publishes a newer cua-driver-rs-v* release, regenerate
# Dove Computer Use's release manifest and open a pull request. CI on that
# pull request (dove-computer's contract tests among them) gates the bump.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "cua-driver version to pin (default: the newest release)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is a newer release out?
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif python -I scripts/computer-use/update_manifest.py --check; then
            echo "Already on the newest cua-driver release."
            exit 0
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
          echo "bump=yes" >> "$GITHUB_OUTPUT"

      - name: Regenerate the manifest
        if: steps.check.outputs.bump == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.check.outputs.version }}" ]; then
            python -I scripts/computer-use/update_manifest.py --version "${{ steps.check.outputs.version }}"
          else
            python -I scripts/computer-use/update_manifest.py
          fi

      - name: Open the pull request
        if: steps.check.outputs.bump == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python -c "import json;print(json.load(open('apps/dove/assets/computer-use-release.json'))['version'])")
          branch="computer-use/cua-driver-$version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request branch for $version already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/dove/assets/computer-use-release.json
          git commit -m "Computer use: pin cua-driver $version"
          git push origin "$branch"
          gh pr create --title "Computer use: pin cua-driver $version" --body "Regenerated by the weekly cua-driver pin workflow from trycua's cua-driver-rs-v$version release: every archive matched GitHub's SHA-256 and the release's SHA256SUMS, and every file inside is listed with its hash. Run the live computer-use test before merging (crates/dove-computer/tests/live.rs)."
