# Vendored from zeronsh/gpui-component @ 701ca97af7983bf85343d2d1d404ab528b18ec96
# (crates/base, Apache-2.0, Longbridge). Dove's only change: the input caret
# stops blinking after a few seconds without input (src/input/base/blink_cursor.rs),
# so an idle focused input costs no frames. See vendor/README.md.
[package]
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
license = "Apache-2.0"
name = "gpui-base"
repository = "https://github.com/zeronsh/gpui-component"
version = "0.5.2"
publish = false
edition = "2024"

[lib]
doctest = false

[features]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow = "1"
aho-corasick = "1.1.3"
chrono = "0.4.38"
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_macros = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
instant = { version = "0.1", features = ["wasm-bindgen"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
regex = "1"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
tracing = "0.1.41"
unicode-segmentation = "1.12.0"
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }
