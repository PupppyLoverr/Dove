[package]
name = "dove-mesh-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Publishes Dove desktop sessions to the Cosmos edge so the Dove phone apps can watch and drive them."

[[bin]]
name = "dove-mesh-host"
path = "src/main.rs"

[dependencies]
zeron-proto.workspace = true
zeron-doc.workspace = true
zeron-sync.workspace = true
zeron-client.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
anyhow.workspace = true
zeron-rpc.workspace = true
async-trait.workspace = true
sha2.workspace = true
# Pairing QR in the terminal (`serve-node`); no image backends.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile.workspace = true
zeron-rpc.workspace = true
zeron-sync = { workspace = true, features = ["mock-server"] }
tokio-tungstenite.workspace = true
