[package]
name = "zeron"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shared by both binaries; the UI is referenced only by `zeron`, so the
# background engine links without it.
[lib]
name = "zeron_app"
path = "src/lib.rs"

[[bin]]
name = "zeron"
path = "src/main.rs"
# (Keplorayx: the old GPUI app, built only with `ui`; the engine needs none of it.)
required-features = ["ui"]

[[bin]]
# Keplorayx's engine.
name = "keplorayx-engine"
path = "src/bin/zeron-engine.rs"

[features]
ui = ["dep:zeron-ui"]

[dependencies]
zeron-engine.workspace = true
zeron-rpc.workspace = true
zeron-ui = { workspace = true, optional = true }
zeron-update.workspace = true
zeron-cli.workspace = true
zeron-mcp.workspace = true
zeron-composio.workspace = true
zeron-notify.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
